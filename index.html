<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bình Chọn Đồng Phục Lớp</title>
    <!-- Tích hợp Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Tích hợp Thư viện quét thiết bị chống gian lận FingerprintJS -->
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    
    <style>
        /* CSS Cơ bản */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0f172a; color: #fff; overflow-x: hidden; min-height: 100vh; }

        /* Splash Screen */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 1s ease-out; }
        #splash h1 { font-size: 4rem; letter-spacing: 5px; animation: pulse 1.5s infinite; color: #fff;}
        #splash p { position: absolute; bottom: 30px; color: #e21b70; font-size: 1rem; animation: blink 1.5s infinite;}
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 10px #fff; } 50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 30px #e21b70; } }

        /* Popup Chọn Giới Tính & Mua Áo */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 9998; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .modal-box { background: #1e293b; padding: 30px; border-radius: 15px; text-align: center; border: 2px solid #334155; max-width: 90%; }
        .modal-box h2 { color: #e21b70; margin-bottom: 10px; }
        .modal-box p { color: #94a3b8; margin-bottom: 25px; font-size: 0.9rem; }
        .modal-btns { display: flex; gap: 15px; justify-content: center; }
        .btn-modal { padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: transform 0.2s; }
        .btn-modal.male { background: #3b82f6; color: white; }
        .btn-modal.female { background: #ec4899; color: white; }
        .btn-modal:hover { transform: scale(1.05); }

        /* Style riêng cho Box Hỏi Mua Áo */
        .purchase-options { display: flex; gap: 20px; justify-content: center; }
        .purchase-opt { cursor: pointer; background: #334155; padding: 15px; border-radius: 12px; transition: transform 0.2s, background 0.2s; width: 140px; }
        .purchase-opt:hover { transform: scale(1.05); background: #475569; }
        .purchase-opt img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; margin-bottom: 10px; border: 3px solid #e21b70; }
        .purchase-opt p { font-size: 1.2rem; font-weight: bold; color: white; margin: 0; }

        /* Hạt Click Chuột & Tuyết */
        .particle { position: absolute; border-radius: 50%; pointer-events: none; animation: explode 0.6s ease-out forwards; z-index: 9997; }
        @keyframes explode { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; } }
        #snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .snowflake { position: absolute; top: -10px; background: white; border-radius: 50%; opacity: 0.8; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(100vh); } }

        /* Layout Chính */
        #main-content { position: relative; z-index: 1; padding: 15px; max-width: 1200px; margin: 0 auto; display: none; }

        /* Bảng xếp hạng */
        .leaderboard { background: rgba(30, 41, 59, 0.85); border-radius: 15px; padding: 20px; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .leaderboard-header { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 15px; }
        .leaderboard-header h2 { color: #fbbf24; font-size: 1.5rem; text-align: center; }
        .online-status { font-size: 0.9rem; color: #10b981; font-weight: bold; background: rgba(16, 185, 129, 0.1); padding: 5px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
        .online-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .lb-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .lb-tab { padding: 8px 15px; background: #334155; color: #cbd5e1; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .lb-tab.active { background: #e21b70; color: white; }

        .leaderboard-list { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .leaderboard-list::-webkit-scrollbar { width: 6px; }
        .leaderboard-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .rank-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 15px; border-radius: 8px; border-left: 4px solid #334155; }
        .rank-item.top-1 { border-left-color: #fbbf24; background: rgba(251, 191, 36, 0.1); }
        .rank-item.top-2 { border-left-color: #94a3b8; background: rgba(148, 163, 184, 0.1); }
        .rank-item.top-3 { border-left-color: #b45309; background: rgba(180, 83, 9, 0.1); }
        .rank-votes { font-weight: bold; color: #10b981; font-size: 1.1rem; }

        /* Lưới Ảnh */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        @media (min-width: 600px) { .gallery { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; } }
        
        .card { background: #1e293b; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .card-img-wrapper { height: 220px; overflow: hidden; cursor: pointer; position: relative; background: #334155;}
        @media (min-width: 600px) { .card-img-wrapper { height: 300px; } }
        .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .card-img-wrapper:hover img { transform: scale(1.05); }
        .card-img-wrapper::after { content: '🔍 Phóng to'; position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 20px; font-size: 11px; }
        
        .card-info { padding: 12px; display: flex; flex-direction: column; gap: 10px; z-index: 2;}
        .vote-count { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.9rem;}
        .vote-count span { color: #e21b70; font-size: 1rem;}
        
        .btn-vote { padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-transform: uppercase; font-size: 0.85rem; width: 100%; }
        .btn-vote.not-voted { background: #e21b70; color: white; }
        .btn-vote.voted { background: #475569; color: #94a3b8; }
        
        /* Lightbox nâng cấp (Có Slider + Nút Vote) */
        #lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 10000; display: flex; justify-content: space-between; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 0 10px; }
        #lightbox.active { opacity: 1; pointer-events: auto; }
        
        .lightbox-center { display: flex; flex-direction: column; align-items: center; gap: 15px; max-width: 90vw; }
        .lightbox-center img { max-width: 100%; max-height: 75vh; border-radius: 8px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .lightbox-btn-vote { width: 250px; max-width: 100%; padding: 15px; font-size: 1.1rem; }

        .nav-btn { color: white; font-size: 40px; cursor: pointer; padding: 20px 10px; user-select: none; transition: color 0.2s; }
        .nav-btn:hover { color: #e21b70; }
        
        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 35px; color: white; cursor: pointer; background: rgba(255,255,255,0.2); width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 10001; }
    </style>
</head>
<body>

    <!-- Splash có thêm dòng báo đang quét phần cứng -->
    <div id="splash">
        <h1>HELLO</h1>
        <p>Đang quét phần cứng chống gian lận...</p>
    </div>

    <!-- Chọn Giới Tính -->
    <div id="gender-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Bạn là Nam hay Nữ?</h2>
            <p>Hãy chọn đúng để tính điểm (Mỗi máy chọn 1 lần duy nhất)</p>
            <div class="modal-btns">
                <button class="btn-modal male" onclick="setGender('male')">Nam 👦</button>
                <button class="btn-modal female" onclick="setGender('female')">Nữ 👧</button>
            </div>
        </div>
    </div>

    <!-- Hỏi Mua Áo -->
    <div id="purchase-modal" class="modal-overlay">
        <div class="modal-box" id="purchase-content">
            <h2>Bạn có muốn mua áo không?</h2>
            <p>Bình chọn thôi chưa đủ, chốt đơn luôn không nào!</p>
            <div class="purchase-options">
                <div class="purchase-opt" onclick="acceptPurchase()">
                    <img src="hinh-nen-chiikawa-51.jpg" alt="Có">
                    <p>Có ❤️</p>
                </div>
                <div class="purchase-opt" onclick="rejectPurchase()">
                    <img src="hinh-nen-chiikawa-48.jpg" alt="Không">
                    <p>Không 💔</p>
                </div>
            </div>
        </div>
    </div>

    <div id="snow-container"></div>
    
    <!-- Lightbox Nâng Cấp -->
    <div id="lightbox" onclick="closeLightbox(event)">
        <div class="close-btn" onclick="closeLightbox(event, true)">&times;</div>
        <div class="nav-btn prev-btn" onclick="prevImage(event)">&#10094;</div>
        <div class="lightbox-center" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="">
            <button id="lightbox-vote-btn" class="btn-vote lightbox-btn-vote" onclick="voteFromLightbox(event)">Bình Chọn</button>
        </div>
        <div class="nav-btn next-btn" onclick="nextImage(event)">&#10095;</div>
    </div>

    <div id="main-content">
        <!-- Bảng xếp hạng -->
        <div class="leaderboard">
            <div class="leaderboard-header">
                <h2>🏆 Bảng Xếp Hạng</h2>
                <div class="online-status">
                    <div class="online-dot"></div>Đang online: <span id="online-count">1</span>
                </div>
            </div>
            
            <div class="lb-tabs">
                <button class="lb-tab active" onclick="switchTab('total')" id="tab-total">Tất cả</button>
                <button class="lb-tab" onclick="switchTab('male')" id="tab-male">Nam vote</button>
                <button class="lb-tab" onclick="switchTab('female')" id="tab-female">Nữ vote</button>
            </div>

            <div class="leaderboard-list" id="leaderboard-list"></div>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        // CẤU HÌNH FIREBASE 
        const firebaseConfig = {
            apiKey: "AIzaSyDnnBYVe86pH2LaxobV4cWwQXY-MnPgpTI",
            authDomain: "voting-2eb94.firebaseapp.com",
            databaseURL: "https://voting-2eb94-default-rtdb.firebaseio.com", 
            projectId: "voting-2eb94",
            storageBucket: "voting-2eb94.firebasestorage.app",
            messagingSenderId: "79110219098",
            appId: "1:79110219098:web:58305bf71d93b8256eff63"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Gộp mảng ảnh và tự động loại bỏ ảnh trùng lặp
        const oldImages = [
            "456447187_1937659403401121_954613996768826159_n.jpg", "462547721_1167905501562420_3933350056981472846_n.jpg",
            "462650453_2865468186955353_4121467214480437293_n.jpg", "475092831_575404725492781_8898609568350516036_n.jpg",
            "487219176_1108363781051950_7885242427360004707_n.jpg", "542384633_1136038485103373_990602521194201985_n.jpg",
            "552698469_810372851525642_5181685412440161548_n.jpg", "553234198_700291336430216_7222963996084897963_n.jpg",
            "582653566_723514100772005_1751646020879804812_n.jpg", "597462480_1081880710909896_1546003193440228884_n.jpg",
            "608325713_2313279522525174_1553684421790787260_n.jpg", "616759615_1446509583927327_7612854746913547033_n.jpg",
            "622196164_803485386123348_5236810255874376600_n.jpg", "622427587_1207847721471596_6853841438414281016_n.jpg",
            "642759306_1604759967563004_3746023901312674129_n.jpg", "764975250_3993791987581860_1911950247103884969_n.jpg",
            "780322483_1459521002207642_4627689339355632345_n.jpg", "792806477_1970249763647313_1779523038025011056_n.jpg",
            "819615723_2207766737289355_6722232517011812916_n.jpg"
        ];
        
        const newImages = [
            "795552810_946169428537319_3688409782957010352_n.jpg", "796249767_1948417079085797_5277502673235934638_n.jpg",
            "790424001_1016427304685752_5136508944415774356_n.jpg", "789871787_1093580503089210_3572085642048572674_n.jpg",
            "789136391_1058767033423909_6979440470712355518_n.jpg", "758367448_1631004475052716_2248646091884446227_n.jpg",
            "758853690_1362231855441461_646000205734170789_n.jpg", "795847342_1099215732567771_456098815878464808_n.jpg",
            "789299036_2128663271395431_3995214931862314952_n.jpg", "797479213_2097578274481281_2935346841871296037_n.jpg",
            "789341776_1781070019693290_5263704496479019397_n.jpg", "791819893_1076436418338033_6075971530382994263_n.jpg",
            "790112425_1072892791897993_8488699634719704795_n.jpg", "789679307_1226723929631958_2453910160471289691_n.jpg",
            "791333464_1047932111564039_3521229384189062192_n.jpg", "791387995_4564994283825568_3964627776333763640_n.jpg",
            "795980376_1659119688908613_770817110093028339_n.jpg", "794902585_1409740587204726_7600441839888571893_n.jpg",
            "793257131_930262680127004_6305804045567105634_n.jpg", "790112170_28806680878923847_4054272130483501837_n.jpg",
            "767299852_2293849451152007_82996407462900848_n.jpg", "790424234_28512635981695843_626566672072091186_n.jpg",
            "767716330_28015762941373587_3919864508761576540_n.jpg", "766240921_4605080879721278_3755861352453581210_n.jpg",
            "788665766_2255417051924161_7950686347686944931_n.jpg", "789972490_1247317034187550_9196037904557741985_n.jpg"
        ];
        
        const images = [...new Set([...oldImages, ...newImages])];

        // Biến toàn cục mới
        let deviceId = ""; 
        let myVotes = {};
        let userGender = null;
        let answeredPurchase = false;
        let globalVotes = {};
        let currentTab = 'total';
        let currentLightboxIndex = 0;

        // Vòng lặp khởi động Web (Thay LocalStorage bằng Đám mây Firebase qua ID Máy)
        window.addEventListener('load', () => {
            // Chạy trình quét thông số máy
            FingerprintJS.load().then(fp => fp.get()).then(result => {
                deviceId = result.visitorId; // ID mã hóa thiết bị (VD: mở Zalo hay Safari thì ID này vẫn ko đổi)
                
                // Kéo dữ liệu quá khứ của thiết bị này từ đám mây về
                db.ref('users/' + deviceId).once('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    userGender = data.gender || null;
                    answeredPurchase = data.answeredPurchase || false;
                    myVotes = data.votes || {};

                    setTimeout(() => {
                        document.getElementById('splash').style.opacity = '0';
                        setTimeout(() => {
                            document.getElementById('splash').style.display = 'none';
                            checkGenderAndStart();
                        }, 800);
                    }, 1000);
                });
            });
        });

        // Hàm Đồng bộ hóa dữ liệu cá nhân lên mây ngay lập tức
        function syncUserData() {
            db.ref('users/' + deviceId).update({
                gender: userGender,
                answeredPurchase: answeredPurchase,
                votes: myVotes
            });
        }

        // Cửa 1: Kiểm tra giới tính
        function checkGenderAndStart() {
            if (!userGender) {
                document.getElementById('gender-modal').style.display = 'flex';
            } else {
                checkPurchaseAndStart();
            }
        }
        function setGender(gender) {
            userGender = gender;
            syncUserData();
            document.getElementById('gender-modal').style.display = 'none';
            checkPurchaseAndStart();
        }

        // Cửa 2: Câu hỏi chốt đơn
        function checkPurchaseAndStart() {
            if (!answeredPurchase) {
                document.getElementById('purchase-modal').style.display = 'flex';
            } else {
                startApp();
            }
        }
        function acceptPurchase() {
            answeredPurchase = true;
            syncUserData();
            document.getElementById('purchase-modal').style.display = 'none';
            startApp();
        }
        function rejectPurchase() {
            const content = document.getElementById('purchase-content');
            content.innerHTML = `
                <img src="bf5699d5355e265de647028a3a54f2b8.jpg" style="max-width:250px; border-radius:15px; margin-bottom:15px; border: 3px solid #e21b70;">
                <h2 style="color:#e21b70; font-size: 1.5rem;">Tại sao lại không nhỉ, câu trả lời sai rồi!</h2>
            `;
            setTimeout(() => {
                answeredPurchase = true;
                syncUserData();
                document.getElementById('purchase-modal').style.display = 'none';
                startApp();
            }, 3500);
        }

        function startApp() {
            document.getElementById('main-content').style.display = 'block';
            renderGallery();
            setupSnow();
            setupClickParticles();
            updateLeaderboard(); 
            listenToFirebase();
            trackOnlineUsers();
        }

        // Báo cáo online bằng Vân tay thiết bị (Không lo bị trùng máy nữa)
        function trackOnlineUsers() {
            const amOnline = db.ref('.info/connected');
            const userRef = db.ref('presence/' + deviceId); // Dùng ID thật của máy

            amOnline.on('value', (snapshot) => {
                if (snapshot.val() === true) {
                    userRef.onDisconnect().remove(); 
                    userRef.set(true);
                }
            });
            db.ref('presence').on('value', (snapshot) => {
                const count = snapshot.numChildren();
                document.getElementById('online-count').innerText = count > 0 ? count : 1;
            });
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            images.forEach((img, index) => {
                const imgId = `img_${index}`;
                const hasVoted = myVotes[imgId] === true;
                const fallbackImg = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5M4buXaSDhuqNuaDwvdGV4dD48L3N2Zz4=";
                
                gallery.innerHTML += `
                    <div class="card" id="card-${imgId}">
                        <div class="card-img-wrapper" onclick="openLightbox(${index})">
                            <img src="${img}" alt="Mẫu ${index + 1}" onerror="this.src='${fallbackImg}'">
                        </div>
                        <div class="card-info">
                            <div class="vote-count">Mẫu số ${index + 1} <span id="count-${imgId}">❤️ 0</span></div>
                            <button type="button" id="btn-${imgId}" class="btn-vote ${hasVoted ? 'voted' : 'not-voted'}" onclick="toggleVote('${imgId}')">
                                ${hasVoted ? 'Hủy Vote' : 'Bình Chọn'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleVote(imgId) {
            if(!userGender) return;
            const hasVoted = myVotes[imgId] === true;
            const voteRef = db.ref('votes/' + imgId);

            if (hasVoted) {
                myVotes[imgId] = false;
            } else {
                myVotes[imgId] = true;
                createParticlesAtElement(document.getElementById(`btn-${imgId}`), ['#e21b70', '#ff6b6b']);
                // Nếu đang mở lightbox, tạo hiệu ứng ở nút lightbox luôn
                if(document.getElementById('lightbox').classList.contains('active')){
                    createParticlesAtElement(document.getElementById('lightbox-vote-btn'), ['#e21b70', '#ff6b6b']);
                }
            }
            
            syncUserData(); // Sao lưu tức thì lên Firebase
            updateGalleryButtons(); 

            voteRef.transaction((currentData) => {
                let data = { male: 0, female: 0, total: 0 };
                if (currentData) {
                    if (typeof currentData === 'number') data.total = currentData; 
                    else data = currentData;
                }
                if (hasVoted) {
                    data[userGender] = Math.max(0, (data[userGender] || 0) - 1);
                    data.total = Math.max(0, (data.total || 0) - 1);
                } else {
                    data[userGender] = (data[userGender] || 0) + 1;
                    data.total = (data.total || 0) + 1;
                }
                return data;
            });
        }

        function listenToFirebase() {
            db.ref('votes').on('value', (snapshot) => {
                globalVotes = snapshot.val() || {};
                updateGalleryButtons();
                updateLeaderboard();
            });
        }

        function updateGalleryButtons() {
            images.forEach((img, index) => {
                const imgId = `img_${index}`;
                const btn = document.getElementById(`btn-${imgId}`);
                const countSpan = document.getElementById(`count-${imgId}`);
                if(btn && countSpan) {
                    const hasVoted = myVotes[imgId] === true;
                    btn.className = `btn-vote ${hasVoted ? 'voted' : 'not-voted'}`;
                    btn.innerText = hasVoted ? 'Hủy Vote' : 'Bình Chọn';
                    
                    let showVotes = 0;
                    if(globalVotes[imgId]) {
                        if(typeof globalVotes[imgId] === 'number') showVotes = globalVotes[imgId];
                        else showVotes = globalVotes[imgId][currentTab] || 0;
                    }
                    countSpan.innerText = `❤️ ${showVotes}`;
                }
            });
            updateLightboxVoteButton(); // Cập nhật nút trong lightbox nếu đang mở
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.lb-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            updateGalleryButtons();
            updateLeaderboard();
        }

        function updateLeaderboard() {
            const sortedImages = images.map((img, index) => {
                const imgId = `img_${index}`;
                let voteCount = 0;
                if(globalVotes[imgId]) {
                    if(typeof globalVotes[imgId] === 'number') voteCount = (currentTab === 'total') ? globalVotes[imgId] : 0;
                    else voteCount = globalVotes[imgId][currentTab] || 0;
                }
                return { id: imgId, name: `Mẫu số ${index + 1}`, votes: voteCount };
            }).sort((a, b) => b.votes - a.votes);

            const lbList = document.getElementById('leaderboard-list');
            lbList.innerHTML = '';
            
            sortedImages.forEach((item, idx) => {
                let rankClass = idx === 0 ? 'top-1' : idx === 1 ? 'top-2' : idx === 2 ? 'top-3' : '';
                let medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '🔹';
                lbList.innerHTML += `
                    <div class="rank-item ${rankClass}">
                        <span>${medal} ${item.name}</span>
                        <span class="rank-votes">❤️ ${item.votes}</span>
                    </div>
                `;
            });
        }

        // --- CƠ CHẾ LIGHTBOX & SLIDER CHUYỂN ẢNH ---
        function openLightbox(index) {
            currentLightboxIndex = index;
            renderLightboxContent();
            document.getElementById('lightbox').classList.add('active');
        }

        function renderLightboxContent() {
            document.getElementById('lightbox-img').src = images[currentLightboxIndex];
            updateLightboxVoteButton();
        }

        function updateLightboxVoteButton() {
            const imgId = `img_${currentLightboxIndex}`;
            const hasVoted = myVotes[imgId] === true;
            const btn = document.getElementById('lightbox-vote-btn');
            btn.className = `btn-vote lightbox-btn-vote ${hasVoted ? 'voted' : 'not-voted'}`;
            
            let showVotes = 0;
            if(globalVotes[imgId]) {
                if(typeof globalVotes[imgId] === 'number') showVotes = globalVotes[imgId];
                else showVotes = globalVotes[imgId]['total'] || 0; 
            }
            btn.innerText = (hasVoted ? 'Hủy Vote' : 'Bình Chọn') + ` (❤️ ${showVotes})`;
        }

        function nextImage(e) {
            e.stopPropagation();
            currentLightboxIndex = (currentLightboxIndex + 1) % images.length;
            renderLightboxContent();
        }

        function prevImage(e) {
            e.stopPropagation();
            currentLightboxIndex = (currentLightboxIndex - 1 + images.length) % images.length;
            renderLightboxContent();
        }

        function voteFromLightbox(e) {
            e.stopPropagation();
            const imgId = `img_${currentLightboxIndex}`;
            toggleVote(imgId);
        }

        function closeLightbox(e, force = false) {
            if (force || e.target.id === 'lightbox') {
                document.getElementById('lightbox').classList.remove('active');
            }
        }

        // --- HIỆU ỨNG TRANG TRÍ ---
        function setupSnow() {
            const container = document.getElementById('snow-container');
            for(let i=0; i<30; i++) {
                let flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.width = flake.style.height = (Math.random() * 5 + 2) + 'px';
                flake.style.animationDuration = (Math.random() * 3 + 3) + 's';
                flake.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(flake);
            }
        }

        function setupClickParticles() {
            document.addEventListener('click', (e) => {
                if(e.target.tagName === 'BUTTON' || e.target.closest('.modal-overlay') || e.target.closest('.nav-btn')) return; 
                createParticles(e.clientX, e.clientY, ['#fff', '#0ea5e9', '#e21b70']);
            });
        }
        function createParticles(x, y, colors) {
            for (let i = 0; i < 6; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.width = p.style.height = (Math.random() * 5 + 3) + 'px';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.setProperty('--tx', (Math.random() - 0.5) * 80 + 'px');
                p.style.setProperty('--ty', (Math.random() - 0.5) * 80 + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }
        function createParticlesAtElement(el, colors) {
            if(!el) return;
            const rect = el.getBoundingClientRect();
            createParticles(rect.left + rect.width/2, rect.top + rect.height/2, colors);
        }
    </script>
</body>
</html>
